<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Mode</title>
    <!--Intégration des icones fontAwesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" />
</head>
<body id="body">

        <style>
        .wrapper {
            transition: 300ms linear;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgb(255, 255, 196) 0%, rgb(255, 97, 100) 50%, rgb(176, 0, 18) 100%);
        }

        .container {
            background-color: azure;
            border-radius: 1.375rem;
            padding: 0.5rem 1.5rem;
            width: 33vw;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        #displayText {
            border: 1px solid #EDEDED;
            padding: 7px 3px;
        }

        .btn {
            border: none;
            background: #EDEDED;
            padding: 7px 7px;
            border-radius: 0.5rem;
            cursor: pointer;
        }

        .invert {
            filter: invert(1);
        }

        #icon {
            position: fixed;
            top: 10px;
            right: 7px;
        }
    </style>
    <button id="icon" class="btn" onclick="changeBackgroundColor()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon-icon lucide-moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
    </button>
    <div class="wrapper">
        <div class="container">
            <h2>Citations</h2>
            <p id="displayedText">Une belle surprise t’attend dans les prochains jours.</p>
        </div>
    </div>

    <script>
        let body = document.getElementById('body');
        let switchModeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;

        let lightMode = true;
        changeBackgroundColor()

        function switchMode() {
            return !lightMode;
        }

        function changeBackgroundColor() {
            lightMode = switchMode();

            // https://developer.mozilla.org/en-US/docs/Web/API/Element/classList
            switchModeIcon = (lightMode) ? `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>` : `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon-icon lucide-moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>`
            document.getElementById("icon").innerHTML = switchModeIcon;
            // https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Conditional_operator
            if (lightMode) {
                document.getElementById('body').classList.add('invert');
            } else {
                document.getElementById('body').classList.remove('invert');
            }
        }
    </script>
</body>
</html>
