<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Déduction URSSAF CA</title>
</head>
<body>

<div class="container container text-center" >
    <form class="form">
        <div class="mb-3">
            <label for="userNumber" class="form-label">Entrer votre chiffre d'affaire</label>
            <input type="number" class="form-control" id="userNumber">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>


<script>
    const CHIFFRE_AFFAIRE = document.getElementById('userNumber');
    const POURCENTAGE_URSSAF = 26;

    function chiffreAffaireApresDeductionURSSAF() {
        return CHIFFRE_AFFAIRE.value - (CHIFFRE_AFFAIRE.value * POURCENTAGE_URSSAF / 100);
    }

    function displayCA(event) {
        event.preventDefault();
        alert("Chiffre d'affaire après déduction URSSAF : " + chiffreAffaireApresDeductionURSSAF());
    }

    document.querySelector('form').addEventListener('submit', displayCA);
</script>

</body>
</html>
