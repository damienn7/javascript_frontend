<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Redirection selon l'âge</title>
</head>

<body>
    <div class="container text-center">
        <form class="form">
            <div class="mb-3">
                <label for="userNumber" class="form-label">Entrer votre age</label>
                <input type="number" class="form-control" id="userNumber">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

<script>
    const REDIRECT_FORM = document.querySelector("form");
    let userBirthdayYear = document.getElementById("userNumber");

    function redirectUserDependsOnAge(event) {
        event.preventDefault();

        let userAge = Number(userBirthdayYear.value);

        if (userAge < 14) {
            window.location.href = "https://www.disneyplus.com/fr-fr";
        } else if (userAge >= 14 && userAge <= 18 ) {
            window.location.href = "https://www.netflix.com/fr/";
        } else {
            window.location.href = "https://www.arte.tv/fr/";
        }
    }

    REDIRECT_FORM.addEventListener("submit", redirectUserDependsOnAge);
</script>


</body>
</html>
